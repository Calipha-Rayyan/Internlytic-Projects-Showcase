<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="docBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#073A40" />
      <stop offset="100%" stop-color="#0A424B" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#docBg)" />

  <g transform="translate(60, 45)">
    <rect width="520" height="270" rx="14" fill="#0C2529" stroke="#18B59A" stroke-width="1.5" stroke-opacity="0.3" />
    <rect width="520" height="36" rx="14" fill="#06181B" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#10B981" opacity="0.8" />
    <text x="260" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8CE1D3" text-anchor="middle">DocuSynthesize Neural OCR &amp; Entity Extractor</text>

    <!-- Document Page Scan with bounding boxes -->
    <g transform="translate(25, 52)">
      <rect width="220" height="200" rx="8" fill="#FFFFFF" />
      <!-- Scanning header -->
      <rect x="20" y="20" width="90" height="12" rx="3" fill="#073A40" />
      <!-- Simulated Lines with OCR Bounding Boxes -->
      <g transform="translate(20, 45)">
        <rect x="0" y="0" width="180" height="14" rx="2" fill="#EAF7F4" stroke="#18B59A" stroke-width="1" stroke-dasharray="2 2" />
        <text x="5" y="11" font-family="'JetBrains Mono', monospace" font-size="8" fill="#073A40">VENDOR: ACME CLOUD INC</text>

        <rect x="0" y="22" width="180" height="14" rx="2" fill="#EAF7F4" stroke="#18B59A" stroke-width="1" stroke-dasharray="2 2" />
        <text x="5" y="33" font-family="'JetBrains Mono', monospace" font-size="8" fill="#073A40">DATE: 2026-10-18</text>

        <rect x="0" y="44" width="180" height="14" rx="2" fill="#EAF7F4" stroke="#22E4C2" stroke-width="1.5" />
        <text x="5" y="55" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#073A40">TOTAL DUE: $12,450.00</text>

        <!-- Paragraph lines -->
        <rect x="0" y="68" width="170" height="6" rx="3" fill="#CCDED9" />
        <rect x="0" y="80" width="150" height="6" rx="3" fill="#CCDED9" />
        <rect x="0" y="92" width="165" height="6" rx="3" fill="#CCDED9" />
        <rect x="0" y="104" width="130" height="6" rx="3" fill="#CCDED9" />
      </g>
      <!-- Green Scanning Line -->
      <line x1="15" y1="95" x2="205" y2="95" stroke="#18B59A" stroke-width="2.5" />
    </g>

    <!-- Structured JSON / Entities View -->
    <g transform="translate(265, 52)">
      <rect width="230" height="200" rx="8" fill="#061B1E" stroke="#18B59A" stroke-width="1" stroke-opacity="0.3" />
      <text x="15" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#22E4C2">extracted_entities.json</text>

      <g transform="translate(15, 40)">
        <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8CE1D3">{</text>
        <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22E4C2">"vendor": <tspan fill="#FFFFFF">"Acme Cloud Inc"</tspan>,</text>
        <text x="12" y="49" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22E4C2">"invoice_no": <tspan fill="#FFFFFF">"INV-2026-904"</tspan>,</text>
        <text x="12" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22E4C2">"currency": <tspan fill="#FFFFFF">"USD"</tspan>,</text>
        <text x="12" y="83" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22E4C2">"total": <tspan fill="#FDE047">12450.00</tspan>,</text>
        <text x="12" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22E4C2">"confidence": <tspan fill="#34D399">0.9984</tspan>,</text>
        <text x="12" y="117" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22E4C2">"tables_extracted": <tspan fill="#FDE047">1</tspan></text>
        <text x="0" y="134" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8CE1D3">}</text>
      </g>
    </g>
  </g>
</svg>
