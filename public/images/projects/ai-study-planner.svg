<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#073A40" />
      <stop offset="100%" stop-color="#0E5761" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22E4C2" />
      <stop offset="100%" stop-color="#18B59A" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg1)" />
  <circle cx="560" cy="80" r="140" fill="#18B59A" opacity="0.12" />
  <circle cx="80" cy="300" r="100" fill="#22E4C2" opacity="0.08" />

  <!-- App Window Container -->
  <g transform="translate(70, 45)">
    <rect width="500" height="270" rx="14" fill="#0C2529" stroke="#18B59A" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Window Bar -->
    <rect width="500" height="34" rx="14" fill="#071E21" />
    <circle cx="22" cy="17" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="38" cy="17" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="54" cy="17" r="5" fill="#10B981" opacity="0.8" />
    <text x="250" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#8CE1D3" text-anchor="middle">AI Adaptive Schedule Engine v2.4</text>

    <!-- Sidebar -->
    <rect x="15" y="48" width="115" height="206" rx="8" fill="#0A3137" />
    <rect x="25" y="60" width="95" height="18" rx="5" fill="#18B59A" opacity="0.25" />
    <rect x="25" y="86" width="75" height="12" rx="4" fill="#8CE1D3" opacity="0.3" />
    <rect x="25" y="106" width="85" height="12" rx="4" fill="#8CE1D3" opacity="0.3" />
    <rect x="25" y="126" width="65" height="12" rx="4" fill="#8CE1D3" opacity="0.3" />

    <!-- Schedule Matrix / Visualizer -->
    <rect x="145" y="48" width="340" height="206" rx="8" fill="#0E3D44" />
    <text x="160" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Adaptive Spaced-Repetition Plan</text>
    <rect x="390" y="60" width="80" height="22" rx="11" fill="url(#tealGrad)" />
    <text x="430" y="75" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#073A40" text-anchor="middle">OPTIMIZED</text>

    <!-- Timeline Blocks -->
    <g transform="translate(160, 92)">
      <rect x="0" y="0" width="95" height="50" rx="6" fill="#144C55" stroke="#18B59A" stroke-width="1" />
      <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#22E4C2">Machine Learning</text>
      <text x="10" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#EAF7F4">09:00 - 10:30 AM</text>

      <rect x="105" y="0" width="105" height="50" rx="6" fill="#144C55" stroke="#22E4C2" stroke-width="1.5" />
      <text x="115" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Neural Networks</text>
      <text x="115" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#22E4C2">Active Retention</text>

      <rect x="220" y="0" width="90" height="50" rx="6" fill="#144C55" opacity="0.7" />
      <text x="230" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8CE1D3">Deep Review</text>
      <text x="230" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#A8D5CF">14:00 - 15:30</text>
    </g>

    <!-- AI Retention Curve Graphic -->
    <g transform="translate(160, 155)">
      <rect width="310" height="85" rx="6" fill="#08292E" />
      <path d="M 15 65 Q 80 15, 150 40 T 295 20" fill="none" stroke="#22E4C2" stroke-width="3" stroke-linecap="round" />
      <path d="M 15 65 Q 80 15, 150 40 T 295 20 L 295 75 L 15 75 Z" fill="#18B59A" fill-opacity="0.1" />
      <circle cx="150" cy="40" r="5" fill="#FFFFFF" stroke="#18B59A" stroke-width="2.5" />
      <circle cx="295" cy="20" r="5" fill="#22E4C2" stroke="#FFFFFF" stroke-width="2" />
      <text x="20" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#EAF7F4">Retention Probability: 94.2%</text>
    </g>
  </g>
</svg>
