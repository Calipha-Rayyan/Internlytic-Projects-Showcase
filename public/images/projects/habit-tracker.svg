<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="habBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#073A40" />
      <stop offset="100%" stop-color="#0E5059" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#habBg)" />

  <!-- Centered Mobile Phone Frame -->
  <g transform="translate(225, 25)">
    <rect width="190" height="310" rx="28" fill="#06181B" stroke="#18B59A" stroke-width="2.5" />
    <!-- Dynamic Island / Speaker -->
    <rect x="65" y="10" width="60" height="12" rx="6" fill="#0C2B30" />

    <!-- Mobile Screen View -->
    <rect x="10" y="28" width="170" height="270" rx="18" fill="#0C2529" />

    <!-- Header -->
    <text x="22" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Daily Rituals</text>
    <text x="22" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8CE1D3">Streak: 18 Days 🔥</text>

    <!-- Progress Ring -->
    <g transform="translate(130, 42)">
      <circle cx="16" cy="16" r="14" stroke="#144C55" stroke-width="3.5" fill="none" />
      <circle cx="16" cy="16" r="14" stroke="#22E4C2" stroke-width="3.5" stroke-dasharray="65 100" stroke-linecap="round" fill="none" />
      <text x="16" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">80%</text>
    </g>

    <!-- Habits List -->
    <g transform="translate(15, 84)">
      <!-- Item 1 -->
      <rect width="140" height="42" rx="8" fill="#113B41" stroke="#18B59A" stroke-width="1" />
      <circle cx="20" cy="21" r="9" fill="#18B59A" />
      <path d="M16 21 L19 24 L25 18" stroke="#073A40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Deep Code Focus</text>
      <text x="36" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#99D5CB">45 min done</text>

      <!-- Item 2 -->
      <g transform="translate(0, 48)">
        <rect width="140" height="42" rx="8" fill="#113B41" stroke="#18B59A" stroke-width="1" />
        <circle cx="20" cy="21" r="9" fill="#18B59A" />
        <path d="M16 21 L19 24 L25 18" stroke="#073A40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Daily Hydration</text>
        <text x="36" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#99D5CB">2.5L completed</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 96)">
        <rect width="140" height="42" rx="8" fill="#113B41" stroke="#18B59A" stroke-width="1" />
        <circle cx="20" cy="21" r="9" fill="#18B59A" />
        <path d="M16 21 L19 24 L25 18" stroke="#073A40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Tech Documentation</text>
        <text x="36" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#99D5CB">Article annotated</text>
      </g>

      <!-- Item 4 (Pending) -->
      <g transform="translate(0, 144)">
        <rect width="140" height="42" rx="8" fill="#0E2F35" />
        <circle cx="20" cy="21" r="9" fill="#0C2529" stroke="#8CE1D3" stroke-width="1" />
        <text x="36" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#EAF7F4">Evening Reflection</text>
        <text x="36" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#668482">Scheduled for 9:30 PM</text>
      </g>
    </g>
  </g>
</svg>
