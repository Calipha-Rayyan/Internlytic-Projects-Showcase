<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="expBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#073A40" />
      <stop offset="100%" stop-color="#0A464E" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#18B59A" />
      <stop offset="100%" stop-color="#55E6CD" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#expBg)" />
  
  <g transform="translate(60, 40)">
    <!-- Dashboard Window -->
    <rect width="520" height="280" rx="14" fill="#0C2529" stroke="#18B59A" stroke-width="1.5" stroke-opacity="0.3" />
    <rect width="520" height="36" rx="14" fill="#061A1D" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#10B981" opacity="0.8" />
    <text x="260" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8CE1D3" text-anchor="middle">FinAnalytics Expense &amp; Cashflow Engine</text>

    <!-- Top KPI Cards -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="150" height="64" rx="8" fill="#113B41" />
      <text x="12" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#99D5CB">Monthly Outflow</text>
      <text x="12" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">$4,820.50</text>

      <rect x="165" y="0" width="150" height="64" rx="8" fill="#113B41" />
      <text x="177" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#99D5CB">Budget Target</text>
      <text x="177" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#22E4C2">$6,000.00</text>

      <rect x="330" y="0" width="150" height="64" rx="8" fill="#113B41" />
      <text x="342" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#99D5CB">Savings Rate</text>
      <text x="342" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#34D399">+19.6%</text>
    </g>

    <!-- Bar Chart Section -->
    <g transform="translate(20, 126)">
      <rect width="295" height="138" rx="8" fill="#0E3339" />
      <text x="15" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Weekly Outflow Comparison</text>
      
      <!-- Chart Bars -->
      <g transform="translate(25, 45)">
        <rect x="0" y="30" width="22" height="45" rx="3" fill="#18B59A" opacity="0.5" />
        <rect x="0" y="10" width="22" height="65" rx="3" fill="url(#barGrad)" />

        <rect x="45" y="35" width="22" height="40" rx="3" fill="#18B59A" opacity="0.5" />
        <rect x="45" y="22" width="22" height="53" rx="3" fill="url(#barGrad)" />

        <rect x="90" y="20" width="22" height="55" rx="3" fill="#18B59A" opacity="0.5" />
        <rect x="90" y="5" width="22" height="70" rx="3" fill="url(#barGrad)" />

        <rect x="135" y="15" width="22" height="60" rx="3" fill="#18B59A" opacity="0.5" />
        <rect x="135" y="32" width="22" height="43" rx="3" fill="url(#barGrad)" />

        <rect x="180" y="25" width="22" height="50" rx="3" fill="#18B59A" opacity="0.5" />
        <rect x="180" y="0" width="22" height="75" rx="3" fill="url(#barGrad)" />

        <rect x="225" y="40" width="22" height="35" rx="3" fill="#18B59A" opacity="0.5" />
        <rect x="225" y="18" width="22" height="57" rx="3" fill="url(#barGrad)" />
      </g>
    </g>

    <!-- Donut Category Breakdown -->
    <g transform="translate(325, 126)">
      <rect width="175" height="138" rx="8" fill="#0E3339" />
      <text x="15" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Category Split</text>
      <circle cx="88" cy="80" r="38" stroke="#154952" stroke-width="12" fill="none" />
      <circle cx="88" cy="80" r="38" stroke="#18B59A" stroke-width="12" stroke-dasharray="140 240" stroke-linecap="round" fill="none" />
      <circle cx="88" cy="80" r="38" stroke="#55E6CD" stroke-width="12" stroke-dasharray="60 240" stroke-dashoffset="-145" stroke-linecap="round" fill="none" />
      <text x="88" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">58%</text>
      <text x="88" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8CE1D3" text-anchor="middle">Operations &amp; Tech</text>
    </g>
  </g>
</svg>
