      <text x="45" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#8CE1D3">Senior Frontend &amp; UI Architect</text>
      
      <!-- Mini Cards -->
      <rect x="0" y="48" width="145" height="65" rx="6" fill="#123E45" stroke="#18B59A" stroke-width="1" />
      <rect x="10" y="58" width="80" height="8" rx="4" fill="#22E4C2" />
      <rect x="10" y="72" width="125" height="6" rx="3" fill="#8CE1D3" opacity="0.4" />
      <rect x="10" y="82" width="95" height="6" rx="3" fill="#8CE1D3" opacity="0.4" />
      <rect x="10" y="96" width="40" height="10" rx="5" fill="#18B59A" />

      <rect x="155" y="48" width="145" height="65" rx="6" fill="#123E45" stroke="#18B59A" stroke-width="1" stroke-opacity="0.4" />
