    <!-- Latency & Throughput Graph -->
    <g transform="translate(290, 114)">
      <rect width="210" height="136" rx="8" fill="#0E3339" />
      <text x="15" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Ingress Traffic Waveform</text>
      <path d="M 15 100 Q 55 40, 95 70 T 175 50 T 195 65" fill="none" stroke="#22E4C2" stroke-width="2.5" />
      <path d="M 15 100 Q 55 40, 95 70 T 175 50 T 195 65 L 195 115 L 15 115 Z" fill="#18B59A" fill-opacity="0.15" />
      <text x="15" y="125" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8CE1D3">Req/s: 18,420 • 99.98% OK</text>
