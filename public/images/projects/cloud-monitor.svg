      <g transform="translate(15, 36)">
        <rect x="0" y="0" width="72" height="38" rx="5" fill="#154952" stroke="#18B59A" stroke-width="1" />
        <circle cx="12" cy="19" r="4" fill="#34D399" />
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF">node-a01</text>
        <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8CE1D3">32 pods</text>

        <rect x="80" y="0" width="72" height="38" rx="5" fill="#154952" stroke="#18B59A" stroke-width="1" />
        <circle cx="12" cy="19" r="4" fill="#34D399" />
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF">node-a02</text>
        <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8CE1D3">31 pods</text>

        <rect x="160" y="0" width="70" height="38" rx="5" fill="#154952" stroke="#18B59A" stroke-width="1" />
        <circle cx="12" cy="19" r="4" fill="#34D399" />
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF">node-a03</text>
        <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8CE1D3">33 pods</text>

        <rect x="0" y="46" width="72" height="38" rx="5" fill="#154952" stroke="#18B59A" stroke-width="1" />
        <circle cx="12" cy="19" r="4" fill="#34D399" />
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF">node-b01</text>
        <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8CE1D3">32 pods</text>

        <rect x="80" y="46" width="72" height="38" rx="5" fill="#154952" stroke="#18B59A" stroke-width="1" />
        <circle cx="12" cy="19" r="4" fill="#34D399" />
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF">node-b02</text>
        <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8CE1D3">30 pods</text>

        <rect x="160" y="46" width="70" height="38" rx="5" fill="#154952" stroke="#22E4C2" stroke-width="1.5" />
        <circle cx="12" cy="19" r="4" fill="#22E4C2" />
        <text x="22" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF">ingress-01</text>
        <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8CE1D3">Active</text>
