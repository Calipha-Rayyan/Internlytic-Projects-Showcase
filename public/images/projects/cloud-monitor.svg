    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#10B981" opacity="0.8" />
    <text x="260" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8CE1D3" text-anchor="middle">KubeWatch Cluster Observability Dashboard</text>

    <!-- Top Stats Bar -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="112" height="52" rx="6" fill="#10383E" />
      <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#99D5CB">Healthy Pods</text>
      <text x="10" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#34D399">128 / 128</text>

      <rect x="122" y="0" width="112" height="52" rx="6" fill="#10383E" />
      <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#99D5CB">Cluster CPU</text>
      <text x="10" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#22E4C2">38.4%</text>

      <rect x="244" y="0" width="112" height="52" rx="6" fill="#10383E" />
      <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#99D5CB">Memory Usage</text>
      <text x="10" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">62.1 GB</text>

      <rect x="366" y="0" width="114" height="52" rx="6" fill="#10383E" />
      <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#99D5CB">P99 Latency</text>
