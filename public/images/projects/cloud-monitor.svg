<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="cldBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#073A40" />
      <stop offset="100%" stop-color="#094A53" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#cldBg)" />

  <g transform="translate(60, 45)">
    <rect width="520" height="270" rx="14" fill="#0C2529" stroke="#18B59A" stroke-width="1.5" stroke-opacity="0.3" />
