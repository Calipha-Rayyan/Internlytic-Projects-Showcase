        <text x="110" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#073A40" text-anchor="middle">1. Product Page: 48,200</text>

        <polygon points="20,34 200,34 180,62 40,62" fill="#22E4C2" opacity="0.9" />
