        <text x="19" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">100%</text>
        <rect x="44" y="32" width="38" height="26" rx="4" fill="#18B59A" fill-opacity="0.75" />
        <text x="63" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">61%</text>
        <rect x="88" y="32" width="38" height="26" rx="4" fill="#18B59A" fill-opacity="0.55" />
        <text x="107" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">44%</text>
        <rect x="132" y="32" width="38" height="26" rx="4" fill="#123E45" />

        <rect x="0" y="64" width="38" height="26" rx="4" fill="#18B59A" />
        <text x="19" y="81" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">100%</text>
        <rect x="44" y="64" width="38" height="26" rx="4" fill="#18B59A" fill-opacity="0.78" />
        <text x="63" y="81" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">65%</text>
        <rect x="88" y="64" width="38" height="26" rx="4" fill="#123E45" />
        <rect x="132" y="64" width="38" height="26" rx="4" fill="#123E45" />

