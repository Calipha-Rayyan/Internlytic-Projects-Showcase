    <text x="260" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8CE1D3" text-anchor="middle">RetailMetrics eCommerce Funnel &amp; Cohort Engine</text>

    <!-- Funnel Visualization Left -->
    <g transform="translate(25, 52)">
