<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="ecomBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#073A40" />
      <stop offset="100%" stop-color="#0A434B" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ecomBg)" />

  <g transform="translate(60, 45)">
