        <polygon points="40,68 180,68 160,96 60,96" fill="#55E6CD" opacity="0.9" />
        <text x="110" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#073A40" text-anchor="middle">3. Checkout Start: 6,420</text>

        <polygon points="60,102 160,102 145,130 75,130" fill="#FFFFFF" />
