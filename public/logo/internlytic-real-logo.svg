    <path d="M28 2 C40 12 52 24 48 38 C44 48 34 52 28 54 C22 52 12 48 8 38 C4 24 16 12 28 2 Z" stroke="#18B59A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
